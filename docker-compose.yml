services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: [ "5672:5672", "15672:15672" ]
  redis:
    image: redis:7.4-alpine
    ports: [ "6379:6379" ]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --http-port=8180 --hostname=http://localhost:8180
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin }
    volumes: [ "./infra/keycloak:/opt/keycloak/data/import:ro" ]
    ports: [ "8180:8180" ]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: [ "16686:16686", "4318:4318" ]
  prometheus:
    image: prom/prometheus:v2.55.0
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    volumes: [ "./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    ports: [ "9090:9090" ]
  grafana:
    image: grafana/grafana:11.3.0
    volumes: [ "./infra/grafana:/etc/grafana/provisioning/datasources:ro" ]
    ports: [ "3000:3000" ]
  app:
    build: .
    network_mode: host   # keeps the token issuer URL (localhost:8180) identical for the client and the API
    environment:
      OTLP_ENDPOINT: http://localhost:4318/v1/traces
    depends_on: [ rabbitmq, redis, keycloak, jaeger ]
