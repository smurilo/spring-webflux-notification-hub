spring:
  application:
    name: notification-hub
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 2
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/notify}

notify:
  rate-limit-per-minute: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
